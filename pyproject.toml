[project]
name = "better-jev-bench"
version = "0.1.0"
description = "A wide, multi-domain, license-tiered corpus and benchmark for typed decision models"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Niyati Singh" }]
dependencies = [
    "datasets>=3.0",
    "huggingface-hub>=0.25",
]

[project.optional-dependencies]
# Nothing here yet. Kept as the seam for the scoring/serving extra (PRD 6.2),
# which is the next milestone and deliberately not a hard dependency of the
# corpus tooling -- `bjb build` and `bjb export` must work without a web stack.
serve = []

[project.scripts]
bjb = "better_jev_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["better_jev_bench"]
